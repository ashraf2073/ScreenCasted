# Made par Ashraf
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed only to attach the APK to a Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Finds settings.gradle.kts wherever the upload put it (repo root or a ScreenCast/ subfolder).
      - name: Locate Gradle project
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Files in the repo:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
